# ReBAT — nginx site (/etc/nginx/sites-available/rebat, symlinked into
# sites-enabled). Terminates HTTPS on the public ports and proxies to the
# apps, which only listen on localhost:
#   8011 -> website       127.0.0.1:3011 (pm2 rebat-website)
#   8012 -> backend API   127.0.0.1:3012 (systemd rebat-backend)
#   8013 -> admin panel   127.0.0.1:3013 (pm2 rebat-admin)
#
# Certificate: Let's Encrypt short-lived IP-address cert, kept in its own
# certbot dirs (/etc/letsencrypt-rebat) so it never touches Loomindica's.
# Renewed by rebat-certbot-renew.timer (see deploy/).
#
# No HSTS on purpose: for a bare IP it would apply to every port on the box
# and break the other HTTP-only services running here.

# rebat.in — only this exact name is matched, so Loomindica
# (loomindica.com) and the default servers (hazy, loaded first) are
# unaffected. Certificate: /etc/letsencrypt-rebat/live/rebat.in, renewed by
# the same rebat-certbot-renew.timer as the IP certificate.
server {
    listen 80;
    server_name rebat.in;

    location /.well-known/acme-challenge/ {
        root /var/www/rebat-acme;
    }
    location / {
        return 301 https://rebat.in$request_uri;
    }
}

server {
    # No `http2` here: on nginx 1.24 it's a per-port option and would also
    # switch HTTP/2 on for Loomindica, which shares port 443.
    listen 443 ssl;
    server_name rebat.in;

    ssl_certificate     /etc/letsencrypt-rebat/live/rebat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rebat/live/rebat.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rebat_ssl:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Port 80 on the bare IP: Let's Encrypt validation + redirect to the site.
server {
    listen 80;
    server_name 34.231.15.242;

    location /.well-known/acme-challenge/ {
        root /var/www/rebat-acme;
    }
    location / {
        return 301 https://34.231.15.242:8011$request_uri;
    }
}

server {
    listen 8011 ssl http2;
    server_name 34.231.15.242 _;

    ssl_certificate     /etc/letsencrypt-rebat/live/rebat-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rebat/live/rebat-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rebat_ssl:10m;
    ssl_session_timeout 1d;

    # Plain http:// on this HTTPS port -> redirect instead of nginx's 400.
    error_page 497 =301 https://$host:$server_port$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8012 ssl http2;
    server_name 34.231.15.242 _;

    ssl_certificate     /etc/letsencrypt-rebat/live/rebat-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rebat/live/rebat-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rebat_ssl:10m;
    ssl_session_timeout 1d;

    error_page 497 =301 https://$host:$server_port$request_uri;

    add_header X-Content-Type-Options nosniff always;

    # Admin image uploads (backend caps them at 10 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite (not append) so clients can't spoof their IP for the
        # backend's rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8013 ssl http2;
    server_name 34.231.15.242 _;

    ssl_certificate     /etc/letsencrypt-rebat/live/rebat-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rebat/live/rebat-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:rebat_ssl:10m;
    ssl_session_timeout 1d;

    error_page 497 =301 https://$host:$server_port$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
